<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>灵魂声波 · 隐藏乐迷人格图鉴</title>
<style>
  :root {
    --bg-deep: #0D0D0F;
    --bg-card: #151519;
    --bg-card-hover: #1C1C22;
    --gold: #D4A359;
    --gold-dim: rgba(212, 163, 89, 0.25);
    --gold-glow: rgba(212, 163, 89, 0.12);
    --wine: #8C2D2D;
    --text-main: #EAE6DF;
    --text-sub: #9A958C;
    --text-muted: #5C5852;
    --border-subtle: rgba(234, 230, 223, 0.08);
    --serif: "Noto Serif SC", "Songti SC", "STSong", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background-color: var(--bg-deep);
    color: var(--text-main);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
    line-height: 1.75;
    display: flex;
    justify-content: center;
  }

  /* 胶片颗粒噪点与环境微光 */
  .ambient-glow {
    position: fixed;
    top: -15%;
    left: 50%;
    transform: translateX(-50%);
    width: 120vw;
    height: 70vh;
    background: radial-gradient(circle, rgba(212, 163, 89, 0.07) 0%, rgba(13, 13, 15, 0) 70%);
    pointer-events: none;
    z-index: 0;
    animation: breathe 8s ease-in-out infinite;
  }

  .film-grain {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.7; transform: translateX(-50%) scale(1); }
    50% { opacity: 1; transform: translateX(-50%) scale(1.06); }
  }

  .app-container {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    position: relative;
    z-index: 2;
    padding: 28px 24px 48px;
    display: flex;
    flex-direction: column;
  }

  /* 页面切换控制 */
  .view {
    display: none;
    flex-direction: column;
    flex: 1;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.45s ease, transform 0.45s ease;
  }

  .view.active {
    display: flex;
    opacity: 1;
    transform: translateY(0);
  }

  /* ==================== 1. 首页样式 ==================== */
  .home-header {
    text-align: center;
    margin-top: 12px;
  }

  .archive-code {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--gold);
    text-transform: uppercase;
    opacity: 0.85;
    margin-bottom: 14px;
  }

  .main-title {
    font-family: var(--serif);
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 2px;
    color: var(--text-main);
    line-height: 1.4;
    margin-bottom: 12px;
  }

  .sub-title {
    font-size: 13.5px;
    color: var(--text-sub);
    letter-spacing: 1px;
    font-weight: 300;
  }

  /* 黑胶唱机交互区 */
  .turntable-stage {
    position: relative;
    width: 280px;
    height: 280px;
    margin: 36px auto 28px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 纯净黑胶唱片 */
  .vinyl-disc {
    width: 256px;
    height: 256px;
    border-radius: 50%;
    background:
      radial-gradient(circle at center,
        transparent 0%,
        transparent 28%,
        rgba(255,255,255,0.03) 28.5%,
        transparent 29%,
        rgba(255,255,255,0.02) 38%,
        transparent 38.5%,
        rgba(255,255,255,0.03) 48%,
        transparent 48.5%,
        rgba(255,255,255,0.02) 58%,
        transparent 58.5%,
        rgba(255,255,255,0.03) 68%,
        transparent 68.5%,
        rgba(255,255,255,0.02) 78%,
        transparent 78.5%,
        rgba(255,255,255,0.03) 88%,
        transparent 88.5%,
        rgba(255,255,255,0.04) 97%,
        #070708 100%
      ),
      conic-gradient(
        from 35deg,
        #111114 0deg,
        #222227 42deg,
        #0F0F12 90deg,
        #1E1E23 145deg,
        #0D0D10 215deg,
        #232328 270deg,
        #111114 360deg
      );
    box-shadow:
      0 20px 50px rgba(0, 0, 0, 0.85),
      inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.3s ease;
  }

  .vinyl-disc.spinning {
    animation: spinVinyl 6s linear infinite;
  }

  @keyframes spinVinyl {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* 唱片中心圆标（极简纯净） */
  .vinyl-label {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #9E3333, #5E1B1B);
    box-shadow:
      inset 0 0 0 1px rgba(212, 163, 89, 0.35),
      0 0 15px rgba(0, 0, 0, 0.6);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .vinyl-label::before {
    content: "33⅓ RPM";
    font-size: 7px;
    letter-spacing: 1px;
    color: rgba(234, 230, 223, 0.65);
    margin-bottom: 18px;
  }

  .vinyl-spindle {
    position: absolute;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #0D0D0F;
    border: 1px solid rgba(212, 163, 89, 0.5);
  }

  /* 机械唱针组件（可交互） */
  .tonearm-assembly {
    position: absolute;
    top: -6px;
    right: 6px;
    width: 84px;
    height: 195px;
    cursor: pointer;
    z-index: 5;
    transform-origin: 54px 28px;
    transform: rotate(-28deg);
    transition: transform 0.85s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .tonearm-assembly.dropped {
    transform: rotate(-6deg);
  }

  .tonearm-svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(-4px 8px 10px rgba(0, 0, 0, 0.75));
  }

  .needle-hint {
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 1.5px;
    margin-bottom: 32px;
    transition: color 0.3s ease;
  }

  .needle-hint span {
    color: var(--gold);
    opacity: 0.85;
  }

  .home-footer {
    margin-top: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  .btn-primary {
    width: 100%;
    padding: 16px 24px;
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold);
    font-family: var(--serif);
    font-size: 15px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
  }

  .btn-primary:hover, .btn-primary:active {
    background: var(--gold-glow);
    box-shadow: 0 0 24px rgba(212, 163, 89, 0.15);
  }

  .meta-note {
    font-size: 11.5px;
    color: var(--text-muted);
    letter-spacing: 1px;
  }

  /* ==================== 2. 答题页样式 ==================== */
  .quiz-top {
    margin-bottom: 36px;
  }

  .quiz-meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
  }

  .part-tag {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--gold);
    opacity: 0.85;
  }

  .q-counter {
    font-family: var(--serif);
    font-size: 14px;
    color: var(--text-sub);
    letter-spacing: 1px;
  }

  .q-counter strong {
    color: var(--text-main);
    font-weight: 500;
  }

  /* 调音台频率刻度进度条 */
  .tuner-track {
    width: 100%;
    height: 14px;
    position: relative;
    display: flex;
    align-items: center;
  }

  .tuner-ticks {
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(
      to right,
      rgba(234, 230, 223, 0.14) 0px,
      rgba(234, 230, 223, 0.14) 1px,
      transparent 1px,
      transparent 10px
    );
    height: 6px;
    top: 4px;
  }

  .tuner-bar-bg {
    width: 100%;
    height: 2px;
    background: rgba(255, 255, 255, 0.08);
    position: relative;
  }

  .tuner-bar-fill {
    height: 100%;
    width: 3.33%;
    background: var(--gold);
    box-shadow: 0 0 10px var(--gold);
    transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    position: relative;
  }

  .tuner-bar-fill::after {
    content: "";
    position: absolute;
    right: -3px;
    top: -4px;
    width: 6px;
    height: 10px;
    background: var(--gold);
    border-radius: 1px;
  }

  .question-stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  .question-stage.fade-out {
    opacity: 0;
    transform: translateY(-6px);
  }

  .question-text {
    font-family: var(--serif);
    font-size: 20px;
    line-height: 1.7;
    color: var(--text-main);
    font-weight: 500;
    margin-bottom: 34px;
    letter-spacing: 0.5px;
  }

  .options-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .option-card {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    padding: 18px 20px;
    display: flex;
    align-items: flex-start;
    gap: 16px;
    cursor: pointer;
    transition: all 0.25s ease;
    text-align: left;
  }

  .option-card:hover {
    background: var(--bg-card-hover);
    border-color: rgba(212, 163, 89, 0.3);
  }

  .option-card.selected {
    background: rgba(212, 163, 89, 0.08);
    border-color: var(--gold);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
  }

  .opt-letter {
    font-family: var(--serif);
    font-size: 14px;
    color: var(--gold);
    opacity: 0.75;
    padding-top: 2px;
    min-width: 16px;
  }

  .option-card.selected .opt-letter {
    opacity: 1;
    font-weight: 600;
  }

  .opt-text {
    font-size: 14.5px;
    line-height: 1.7;
    color: var(--text-main);
    opacity: 0.92;
  }

  .quiz-nav {
    margin-top: 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .btn-prev {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 13px;
    letter-spacing: 1px;
    cursor: pointer;
    padding: 8px 0;
    transition: color 0.2s ease;
  }

  .btn-prev:hover:not(:disabled) {
    color: var(--text-sub);
  }

  .btn-prev:disabled {
    opacity: 0;
    pointer-events: none;
  }

  /* ==================== 3. 结果海报页样式 ==================== */
  .result-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* 3:4 截图友好海报卡片 */
  .poster-card {
    width: 100%;
    background: linear-gradient(165deg, #16161B 0%, #0E0E11 100%);
    border: 1px solid rgba(212, 163, 89, 0.25);
    padding: 34px 26px 32px;
    position: relative;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85);
    margin-bottom: 24px;
  }

  /* 四角微细金属装饰角标 */
  .poster-card::before, .poster-card::after {
    content: "";
    position: absolute;
    width: 10px;
    height: 10px;
    border-color: var(--gold);
    border-style: solid;
    opacity: 0.5;
  }
  .poster-card::before { top: 8px; left: 8px; border-width: 1px 0 0 1px; }
  .poster-card::after { bottom: 8px; right: 8px; border-width: 0 1px 1px 0; }

  .poster-top-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10.5px;
    letter-spacing: 2px;
    color: var(--text-muted);
    margin-bottom: 26px;
  }

  .poster-no {
    color: var(--gold);
    font-family: var(--serif);
  }

  .result-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 26px;
  }

  .result-title-group {
    flex: 1;
  }

  .result-kicker {
    font-size: 11.5px;
    color: var(--text-sub);
    letter-spacing: 1.5px;
    margin-bottom: 8px;
  }

  .result-persona {
    font-family: var(--serif);
    font-size: 25px;
    font-weight: 600;
    color: var(--text-main);
    letter-spacing: 1.5px;
    line-height: 1.35;
  }

  /* 迷你装饰黑胶 */
  .mini-vinyl {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    flex-shrink: 0;
    background: conic-gradient(from 45deg, #121215, #26262C, #101013, #242429, #121215);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1), 0 6px 16px rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: spinVinyl 10s linear infinite;
  }

  .mini-vinyl-core {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--wine);
    border: 1px solid rgba(212, 163, 89, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .mini-vinyl-core::after {
    content: "";
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #0D0D0F;
  }

  /* 灵魂金句引用块 */
  .soul-quote {
    font-family: var(--serif);
    font-size: 15px;
    line-height: 1.85;
    color: var(--gold);
    padding: 16px 0 16px 16px;
    border-left: 1.5px solid var(--gold);
    margin-bottom: 26px;
    letter-spacing: 0.5px;
  }

  .result-desc {
    font-size: 13.8px;
    line-height: 1.9;
    color: var(--text-main);
    opacity: 0.88;
    margin-bottom: 28px;
    text-align: justify;
  }

  /* 四维指标条 */
  .dimensions-box {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 28px;
    padding-top: 20px;
    border-top: 1px solid var(--border-subtle);
  }

  .dim-row {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 11.5px;
  }

  .dim-label {
    width: 82px;
    color: var(--text-sub);
    letter-spacing: 0.5px;
  }

  .dim-track {
    flex: 1;
    height: 3px;
    background: rgba(255, 255, 255, 0.07);
    position: relative;
  }

  .dim-fill {
    height: 100%;
    background: var(--gold);
    opacity: 0.85;
  }

  .dim-val {
    width: 32px;
    text-align: right;
    color: var(--text-muted);
    font-family: var(--serif);
  }

  /* 隐藏天赋与搭子 */
  .poster-extras {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    padding-top: 18px;
    border-top: 1px solid var(--border-subtle);
  }

  .extra-item h4 {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 1.5px;
    font-weight: 400;
    margin-bottom: 6px;
  }

  .extra-item p {
    font-family: var(--serif);
    font-size: 13px;
    color: var(--text-main);
    line-height: 1.5;
  }

  .poster-watermark {
    margin-top: 26px;
    text-align: center;
    font-size: 10px;
    letter-spacing: 2.5px;
    color: var(--text-muted);
    opacity: 0.7;
  }

  .result-actions {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .screenshot-tip {
    font-size: 12px;
    color: var(--text-sub);
    letter-spacing: 1px;
  }

  .btn-restart {
    width: 100%;
    padding: 14px;
    background: transparent;
    border: 1px solid var(--border-subtle);
    color: var(--text-sub);
    font-size: 13px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.25s ease;
  }

  .btn-restart:hover {
    border-color: var(--gold-dim);
    color: var(--text-main);
  }
</style>
</head>
<body>

<div class="ambient-glow"></div>
<div class="film-grain"></div>

<main class="app-container">

  <!-- ==================== 1. 测试首页 ==================== -->
  <section id="view-home" class="view active">
    <header class="home-header">
      <div class="archive-code">SOUNDWAVE ARCHIVE · VOL.01</div>
      <h1 class="main-title">灵魂声波</h1>
      <p class="sub-title">在耳机与现场之间，辨认你的隐藏乐迷人格</p>
    </header>

    <div class="turntable-stage">
      <!-- 纯净黑胶盘面 -->
      <div class="vinyl-disc" id="vinyl-disc" title="点击启动唱盘">
        <div class="vinyl-label">
          <div class="vinyl-spindle"></div>
        </div>
      </div>

      <!-- 可交互机械唱针 -->
      <div class="tonearm-assembly" id="tonearm" title="拨动唱针开始测试">
        <svg class="tonearm-svg" viewBox="0 0 90 210" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- 底座轴承 -->
          <circle cx="58" cy="30" r="18" fill="#1C1C21" stroke="#D4A359" stroke-width="1" stroke-opacity="0.45"/>
          <circle cx="58" cy="30" r="9" fill="#2A2A32" stroke="#8C857B" stroke-width="0.8"/>
          <circle cx="58" cy="30" r="3" fill="#D4A359"/>
          <!-- 配重块 -->
          <rect x="50" y="4" width="16" height="12" rx="2" fill="#26262D" stroke="#D4A359" stroke-width="0.8" stroke-opacity="0.6"/>
          <!-- 金属S型唱臂 -->
          <path d="M58 30 L58 95 C58 115, 44 128, 42 152 L39 175" stroke="url(#armGrad)" stroke-width="3.2" stroke-linecap="round"/>
          <!-- 唱头壳 (Headshell) -->
          <g transform="translate(39, 175) rotate(16)">
            <rect x="-5" y="0" width="10" height="18" rx="1.5" fill="#1E1E24" stroke="#D4A359" stroke-width="1"/>
            <line x1="6" y1="5" x2="11" y2="3" stroke="#D4A359" stroke-width="1.2" stroke-linecap="round"/>
            <circle cx="0" cy="19" r="1.5" fill="#D4A359"/>
          </g>
          <defs>
            <linearGradient id="armGrad" x1="58" y1="30" x2="39" y2="175" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#B8B2A8"/>
              <stop offset="50%" stop-color="#EAE6DF"/>
              <stop offset="100%" stop-color="#9A958C"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
    </div>

    <div class="needle-hint" id="needle-hint">轻触 <span>唱针</span> 落入音轨，开启聆听</div>

    <footer class="home-footer">
      <button class="btn-primary" id="btn-start">开始声波测试</button>
      <div class="meta-note">共 30 道生活化场景题 · 约需 3 分钟</div>
    </footer>
  </section>

  <!-- ==================== 2. 题目作答页 ==================== -->
  <section id="view-quiz" class="view">
    <div class="quiz-top">
      <div class="quiz-meta">
        <span class="part-tag" id="part-tag">PART I · 聆听介质</span>
        <span class="q-counter"><strong id="q-current">01</strong> / 30</span>
      </div>
      <div class="tuner-track">
        <div class="tuner-ticks"></div>
        <div class="tuner-bar-bg">
          <div class="tuner-bar-fill" id="progress-fill"></div>
        </div>
      </div>
    </div>

    <div class="question-stage" id="question-stage">
      <h2 class="question-text" id="question-text">题目加载中...</h2>
      <div class="options-list" id="options-list"></div>
    </div>

    <div class="quiz-nav">
      <button class="btn-prev" id="btn-prev" disabled>← 返回上一题</button>
      <span class="meta-note" style="opacity: 0.5;">凭第一直觉作答</span>
    </div>
  </section>

  <!-- ==================== 3. 结果海报页 ==================== -->
  <section id="view-result" class="view">
    <div class="result-wrapper">
      <article class="poster-card" id="poster-card">
        <div class="poster-top-meta">
          <span>SOUNDWAVE PERSONA</span>
          <span class="poster-no" id="res-no">NO.01 / 08</span>
        </div>

// 状态管理
let currentIdx = 0;
let answers = new Array(QUESTIONS.length).fill(null);
let isTransitioning = false;

// DOM 引用
const viewHome = document.getElementById("view-home");
const viewQuiz = document.getElementById("view-quiz");
const viewResult = document.getElementById("view-result");

const tonearm = document.getElementById("tonearm");
const vinylDisc = document.getElementById("vinyl-disc");
const needleHint = document.getElementById("needle-hint");
const btnStart = document.getElementById("btn-start");

const partTag = document.getElementById("part-tag");
const qCurrent = document.getElementById("q-current");
const progressFill = document.getElementById("progress-fill");
const questionStage = document.getElementById("question-stage");
const questionText = document.getElementById("question-text");
const optionsList = document.getElementById("options-list");
const btnPrev = document.getElementById("btn-prev");
const btnRestart = document.getElementById("btn-restart");

// 切换视图
function switchView(targetView) {
  [viewHome, viewQuiz, viewResult].forEach(v => {
    v.classList.remove("active");
    v.style.display = "none";
  });
  targetView.style.display = "flex";
  // 触发重绘以执行淡入动画
  requestAnimationFrame(() => {
    targetView.classList.add("active");
  });
  window.scrollTo({ top: 0, behavior: "smooth" });
}

// 落针启动逻辑
let isLaunching = false;
function launchTest() {
  if (isLaunching) return;
  isLaunching = true;

  tonearm.classList.add("dropped");
  needleHint.innerHTML = "唱针已落入音轨 · <span>正在读取声波...</span>";

  setTimeout(() => {
    vinylDisc.classList.add("spinning");
  }, 450);

  setTimeout(() => {
    currentIdx = 0;
    answers.fill(null);
    renderQuestion(false);
    switchView(viewQuiz);
    isLaunching = false;
  }, 1350);
}

tonearm.addEventListener("click", launchTest);
vinylDisc.addEventListener("click", launchTest);
btnStart.addEventListener("click", launchTest);

// 渲染题目
function renderQuestion(animate = true) {
  const item = QUESTIONS[currentIdx];
  const letters = ["A", "B", "C", "D"];

  const updateDOM = () => {
    partTag.textContent = item.part;
    qCurrent.textContent = String(currentIdx + 1).padStart(2, "0");
    progressFill.style.width = `${((currentIdx + 1) / QUESTIONS.length) * 100}%`;
    questionText.textContent = item.q;
    btnPrev.disabled = currentIdx === 0;

    optionsList.innerHTML = "";
    item.opts.forEach((opt, i) => {
      const btn = document.createElement("button");
      btn.className = "option-card";
      if (answers[currentIdx] === i) {
        btn.classList.add("selected");
      }
      btn.innerHTML = `
        <span class="opt-letter">${letters[i]}</span>
        <span class="opt-text">${opt.text}</span>
      `;
      btn.addEventListener("click", () => handleSelect(i, btn));
      optionsList.appendChild(btn);
    });
  };

  if (animate) {
    questionStage.classList.add("fade-out");
    setTimeout(() => {
      updateDOM();
      questionStage.classList.remove("fade-out");
    }, 220);
  } else {
    updateDOM();
  }
}

// 选择答案
function handleSelect(optIndex, cardEl) {
  if (isTransitioning) return;
  isTransitioning = true;

  answers[currentIdx] = optIndex;
  document.querySelectorAll(".option-card").forEach(el => el.classList.remove("selected"));
  cardEl.classList.add("selected");

  setTimeout(() => {
    if (currentIdx < QUESTIONS.length - 1) {
      currentIdx++;
      renderQuestion(true);
      isTransitioning = false;
    } else {
      calculateAndShowResult();
      isTransitioning = false;
    }
  }, 320);
}

// 上一题
btnPrev.addEventListener("click", () => {
  if (currentIdx > 0 && !isTransitioning) {
    currentIdx--;
    renderQuestion(true);
  }
});

// 计算结果并渲染海报
function calculateAndShowResult() {
  const raw = { ritual: 0, live: 0, lyric: 0, niche: 0 };
  const maxPossible = { ritual: 72, live: 58, lyric: 65, niche: 68 };

  answers.forEach((ansIdx, qIdx) => {
    if (ansIdx !== null) {
      const s = QUESTIONS[qIdx].opts[ansIdx].s;
      raw.ritual += s.ritual;
      raw.live += s.live;
      raw.lyric += s.lyric;
      raw.niche += s.niche;
    }
  });

  // 归一化为 0 - 100 指数（保底 28% 保证视觉美观）
  const dims = {
    ritual: Math.min(98, Math.max(28, Math.round((raw.ritual / maxPossible.ritual) * 100))),
    live: Math.min(98, Math.max(26, Math.round((raw.live / maxPossible.live) * 100))),
    lyric: Math.min(98, Math.max(28, Math.round((raw.lyric / maxPossible.lyric) * 100))),
    niche: Math.min(98, Math.max(28, Math.round((raw.niche / maxPossible.niche) * 100)))
  };

  // 匹配人格
  let matched = PERSONAS[PERSONAS.length - 1];
  for (const p of PERSONAS) {
    if (p.match(dims)) {
      matched = p;
      break;
    }
  }

  document.getElementById("res-no").textContent = matched.no;
  document.getElementById("res-title").textContent = matched.title;
  document.getElementById("res-quote").textContent = matched.quote;
  document.getElementById("res-desc").textContent = matched.desc;
  document.getElementById("res-talent").textContent = matched.talent;
  document.getElementById("res-partner").textContent = matched.partner;

  const dimConfig = [
    { label: "媒介仪式感", val: dims.ritual },
    { label: "现场投入度", val: dims.live },
    { label: "歌词共情力", val: dims.lyric },
    { label: "小众挖掘欲", val: dims.niche }
  ];

  const dimsContainer = document.getElementById("res-dims");
  dimsContainer.innerHTML = dimConfig.map(item => `
    <div class="dim-row">
      <span class="dim-label">${item.label}</span>
      <div class="dim-track">
        <div class="dim-fill" style="width: ${item.val}%"></div>
      </div>
      <span class="dim-val">${item.val}%</span>
    </div>
  `).join("");

  switchView(viewResult);
}

// 重新测试
btnRestart.addEventListener("click", () => {
  tonearm.classList.remove("dropped");
  vinylDisc.classList.remove("spinning");
  needleHint.innerHTML = '轻触 <span>唱针</span> 落入音轨，开启聆听';

});
